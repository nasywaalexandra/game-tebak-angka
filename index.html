<?php
session_start();

// Reset game
if ($_SERVER["REQUEST_METHOD"] == "POST" && isset($_POST['ulang'])) {
    session_destroy();
    header("Location: index.php");
    exit;
}

// Inisialisasi game baru
if (!isset($_SESSION['angka_acak'])) {
    $_SESSION['angka_acak'] = rand(1, 100);
    $_SESSION['sisa_tebakan'] = 5;
    $_SESSION['pesan'] = "Silakan tebak angka antara 1 sampai 100!";
    $_SESSION['selesai'] = false;
}

// Proses tebakan
if ($_SERVER["REQUEST_METHOD"] == "POST" && isset($_POST['tebakan']) && !$_SESSION['selesai']) {
    $tebakan = $_POST['tebakan'];
    $_SESSION['sisa_tebakan']--;

    if ($tebakan == $_SESSION['angka_acak']) {
        $_SESSION['pesan'] = "🎉 BENAR! Angkanya adalah ".$_SESSION['angka_acak']."! Kamu Menang! 🎊";
        $_SESSION['selesai'] = true;
    } elseif ($_SESSION['sisa_tebakan'] <= 0) {
        $_SESSION['pesan'] = "😞 KALAH! Kesempatan habis! Jawabannya adalah: ".$_SESSION['angka_acak'];
        $_SESSION['selesai'] = true;
    } elseif ($tebakan > $_SESSION['angka_acak']) {
        $_SESSION['pesan'] = "⬇️ Terlalu besar! Sisa: ".$_SESSION['sisa_tebakan']." kali lagi";
    } else {
        $_SESSION['pesan'] = "⬆️ Terlalu kecil! Sisa: ".$_SESSION['sisa_tebakan']." kali lagi";
    }
}
