<!DOCTYPE html>
<html>
<head>
    <title>Game Tebak Angka</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>🎮 Game Tebak Angka</h1>
    <p>Tebak angka antara 1 sampai 100:</p>
    
    <form method="post">
        <input type="number" name="tebakan" min="1" max="100" placeholder="1-100" required>
        <br><br>
        <button type="submit">Cek Tebakan</button>
    </form>
</body>
</html>
